<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Scaffold reference: comp-a-real-1536.png</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&display=swap">
  <link rel="stylesheet" href="layout.css">
  <style>html,body{margin:0}body{background:#0e0d0d}.region{box-sizing:border-box}.region.text p{white-space:pre-wrap}</style>
</head>
<body>
<!-- Reference only. Every region sits at its measured box inside a comp-aspect frame. Take the boxes (layout.css), keep your own semantic structure. -->
<main class="comp-frame" style="max-width:1536px">
  <figure class="r-hero-video region plate" data-region="hero-video"><img src="../../../assets/plates/hero-video.png" alt="" style="width:100%;height:100%;object-fit:contain;object-position:center"></figure>
  <div class="r-lockup region chrome" data-region="lockup"><!-- the Sunnsteel lockup: the line mark and the SUNNSTEEL wordmark in Cinzel --></div>
  <div class="r-nav region control" data-region="nav"><!-- Product menu trigger with its chevron, and the Pricing link: rebuild the control's chrome from the crop (comp-spec.mjs --crop nav); its ink box, border, fill, radius, and label size are the comp's --></div>
  <div class="r-top-actions region control" data-region="top-actions"><!-- EN · ES language switch, the Sign in link and the filled START FREE button: rebuild the control's chrome from the crop (comp-spec.mjs --crop top-actions); its ink box, border, fill, radius, and label size are the comp's --></div>
  <div class="r-eyebrow region text" data-region="eyebrow"><!-- eyebrow label FREE TO START · NO APP STORE NEEDED --><p style="font-size:var(--r-eyebrow-font);line-height:1.05;margin:0">eyebrow</p></div>
  <div class="r-headline region text" data-region="headline"><!-- three-line Cinzel headline STATUES AREN'T BORN. THEY'RE CARVED. with a rule under CARVED --><p style="font-size:var(--r-headline-font);font-family:var(--r-headline-family),sans-serif;font-weight:var(--r-headline-weight);line-height:1.05;margin:0">headline</p></div>
  <div class="r-subline region text" data-region="subline"><!-- lead paragraph, three lines --><p style="font-size:var(--r-subline-font);line-height:1.05;margin:0">subline</p></div>
  <div class="r-cta-primary region control" data-region="cta-primary"><!-- filled CREATE A FREE ACCOUNT button: rebuild the control's chrome from the crop (comp-spec.mjs --crop cta-primary); its ink box, border, fill, radius, and label size are the comp's --></div>
  <div class="r-cta-signin region control" data-region="cta-signin"><!-- underlined Sign in link: rebuild the control's chrome from the crop (comp-spec.mjs --crop cta-signin); its ink box, border, fill, radius, and label size are the comp's --></div>
  <div class="r-install-line region text" data-region="install-line"><!-- install line with the How to install link --><p style="font-size:var(--r-install-line-font);line-height:1.05;margin:0">install-line</p></div>
  <div class="r-phone region chrome" data-region="phone"><!-- the live-session phone mock-up: an original frame, Squat, three ticked set rows, the rest bar --></div>
  <div class="r-record-card region control" data-region="record-card"><!-- record card: honour arrow, New record · Squat, 85 kg × 5: rebuild the control's chrome from the crop (comp-spec.mjs --crop record-card); its ink box, border, fill, radius, and label size are the comp's --></div>
  <div class="r-pause region control" data-region="pause"><!-- round video pause button: rebuild the control's chrome from the crop (comp-spec.mjs --crop pause); its ink box, border, fill, radius, and label size are the comp's --></div>
  <div class="r-proof-rules region chrome" data-region="proof-rules"><!-- the proof band's rule above and the hairlines between its four cells --></div>
  <div class="r-proof-1 region text" data-region="proof-1"><!-- 12,400 numeral over the MEMBERS label --><p style="font-size:var(--r-proof-1-font);line-height:1.05;margin:0">proof-1</p></div>
  <div class="r-proof-2 region text" data-region="proof-2"><!-- 350,000 numeral over the WORKOUTS LOGGED label --><p style="font-size:var(--r-proof-2-font);line-height:1.05;margin:0">proof-2</p></div>
  <div class="r-proof-3 region text" data-region="proof-3"><!-- 80+ numeral over the EXERCISES IN THE CATALOG label --><p style="font-size:var(--r-proof-3-font);line-height:1.05;margin:0">proof-3</p></div>
  <div class="r-proof-4 region text" data-region="proof-4"><!-- Free over the TO START label --><p style="font-size:var(--r-proof-4-font);line-height:1.05;margin:0">proof-4</p></div>
</main>
</body>
</html>
