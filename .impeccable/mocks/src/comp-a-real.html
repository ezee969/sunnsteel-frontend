<!doctype html>
<!--
  Comp A redrawn over the approved footage (SITE-01, 2026-11-21): the approved
  comp's composition with its AI imagery replaced by the real poster frames in
  public/site/video. A comp, not the page: rendered once to PNG and measured.
  ?frame=desktop (1536x864) | ?frame=phone (390x844), &lang=en|es
-->
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Cinzel:wght@600&family=Oswald:wght@500;600&family=Source+Sans+3:wght@400;600&family=Space+Mono&display=block" rel="stylesheet" />
<style>
	:root {
		--background: oklch(0.155 0.01 70);
		--foreground: oklch(0.94 0.01 88);
		--surface: oklch(0.205 0.011 70);
		--primary: oklch(0.94 0.01 88);
		--primary-foreground: oklch(0.155 0.01 70);
		--ink-2: oklch(0.79 0.01 84);
		--ink-3: oklch(0.64 0.01 80);
		--rule: oklch(0.37 0.012 72);
		--rule-faint: oklch(0.295 0.01 72);
		--honour: oklch(0.8 0.1 90);
		--site-scrim: oklch(0.155 0.01 70 / 0.64);
		--column-scrim: transparent;
	}
	* { box-sizing: border-box; margin: 0; padding: 0; }
	html, body { background: var(--background); color: var(--foreground); }
	body { font-family: 'Source Sans 3', sans-serif; -webkit-font-smoothing: antialiased; overflow: hidden; }
	.label { font-family: Oswald, sans-serif; font-weight: 500; font-size: 12px; line-height: 1.3; letter-spacing: 0.06em; text-transform: uppercase; }
	.button { font-family: Oswald, sans-serif; font-weight: 600; font-size: 14px; letter-spacing: 0.04em; text-transform: uppercase; }
	.action { font-family: Oswald, sans-serif; font-weight: 600; font-size: 14px; letter-spacing: 0.01em; }
	.wordmark { font-family: Cinzel, serif; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; margin-right: -0.12em; }
	.display { font-family: Cinzel, serif; font-weight: 600; text-transform: uppercase; letter-spacing: 0.02em; line-height: 1.02; text-wrap: balance; }
	.display mark { background: none; color: inherit; text-decoration: underline; text-decoration-thickness: 0.06em; text-underline-offset: 0.16em; }
	.lead { font-size: 18px; line-height: 1.5; color: var(--ink-2); max-width: 52ch; }
	.small { font-size: 14px; line-height: 1.5; color: var(--ink-2); }
	.small a { color: var(--foreground); text-decoration: underline; text-underline-offset: 3px; }
	.filled { display: inline-flex; align-items: center; justify-content: center; height: 48px; padding: 0 24px; background: var(--primary); color: var(--primary-foreground); border-radius: 2px; white-space: nowrap; }
	.ghost { display: inline-flex; align-items: center; justify-content: center; height: 48px; padding: 0 16px; color: var(--foreground); border-radius: 2px; white-space: nowrap; }
	.ghost span { text-decoration: underline; text-underline-offset: 4px; text-decoration-thickness: 1px; }

	.hero { position: relative; overflow: hidden; }
	.hero > img.poster { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
	.hero > .scrim { position: absolute; inset: 0; background: var(--site-scrim); }
	.hero > .column { position: absolute; top: 0; bottom: 0; left: 0; background: var(--column-scrim); }
	.bar { position: absolute; left: 0; right: 0; top: 0; display: flex; align-items: center; z-index: 2; }
	.lockup { display: flex; align-items: center; gap: 12px; color: var(--foreground); }
	.pause { position: absolute; width: 44px; height: 44px; display: grid; place-items: center; z-index: 2; }
	.pause i { width: 32px; height: 32px; border: 1px solid var(--ink-2); border-radius: 50%; display: grid; place-items: center; }
	.proof { display: grid; border-top: 1px solid var(--rule); border-bottom: 1px solid var(--rule); }
	.cell { display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
	.numeral { font-family: 'Bebas Neue', sans-serif; line-height: 0.95; letter-spacing: 0.02em; }

	/* Desktop frame: comp A's geometry, measured off the approved comp. */
	body.desktop { width: 1536px; height: 864px; }
	.desktop .hero { height: 728px; }
	.desktop .hero > .column { width: 760px; }
	.desktop .bar { height: 84px; padding: 0 56px; gap: 0; }
	.desktop .bar .lockup .wordmark { font-size: 27px; }
	.desktop .bar nav { display: flex; gap: 48px; margin-left: 56px; font-family: Oswald, sans-serif; font-weight: 500; font-size: 15px; letter-spacing: 0.02em; }
	.desktop .bar .right { margin-left: auto; display: flex; align-items: center; gap: 44px; }
	.desktop .bar .lang { color: var(--ink-3); }
	.desktop .bar .lang b { color: var(--foreground); font-weight: 500; text-decoration: underline; text-underline-offset: 5px; }
	.desktop .bar .filled { height: 38px; padding: 0 24px; }
	.desktop .text { position: absolute; left: 57px; top: 140px; width: 700px; z-index: 2; }
	.desktop .text .label { font-size: 15px; letter-spacing: 0.16em; }
	.desktop .text h1 { font-size: 70px; margin-top: 24px; }
	.desktop .text .lead { font-size: 20px; margin-top: 40px; max-width: 460px; }
	.desktop .text .actions { display: flex; align-items: center; gap: 20px; margin-top: 40px; }
	.desktop .text .actions .filled { height: 56px; padding: 0 30px; font-size: 15px; letter-spacing: 0.1em; }
	.desktop .text .small { margin-top: 28px; font-size: 15px; }
	.desktop .pause { right: 22px; bottom: 14px; }
	.desktop .proof { grid-template-columns: repeat(4, 1fr); height: 136px; }
	.desktop .cell + .cell { border-left: 1px solid var(--rule-faint); }
	.desktop .cell { margin: 24px 0; }
	.desktop .numeral { font-size: 44px; }
	.desktop .cell .label { margin-top: 12px; font-size: 14px; letter-spacing: 0.14em; }
	.desktop .cell.word .numeral { font-family: Oswald, sans-serif; font-weight: 500; font-size: 30px; letter-spacing: 0.08em; }

	/* Brand-line trial: the headline in the condensed display face. */
	.condensed .text h1 { font-family: 'Bebas Neue', sans-serif; font-weight: 400; letter-spacing: 0.01em; line-height: 0.9; }
	.desktop.condensed .text h1 { font-size: 112px; }
	.phone.condensed .text h1 { font-size: 58px; }

	/* The phone mock-up: an original frame, the live session resting on the record. */
	.device { position: absolute; z-index: 2; width: 202px; left: 1180px; top: 296px; height: 432px; border: 1.5px solid var(--rule); border-bottom: 0; border-radius: 28px 28px 0 0; background: oklch(0.118 0.009 70); padding: 12px 16px; }
	.device .status { display: flex; justify-content: space-between; font-size: 9px; color: var(--ink-2); font-family: 'Source Sans 3'; }
	.device h3 { font-family: Cinzel, serif; font-weight: 600; font-size: 21px; margin-top: 28px; letter-spacing: 0.02em; }
	.device .label { font-size: 8px; margin-top: 18px; color: var(--ink-2); }
	.device .row { display: flex; justify-content: space-between; align-items: center; height: 34px; padding: 0 10px; margin-top: 6px; border: 1px solid var(--rule); font-family: 'Space Mono', monospace; font-size: 12px; }
	.device .row:first-of-type { margin-top: 10px; }
	.device .rest { margin-top: 26px; border-top: 1px solid var(--rule-faint); padding-top: 12px; }
	.device .bar-track { display: flex; align-items: center; gap: 10px; margin-top: 8px; font-size: 11px; }
	.device .bar-track span { flex: 1; height: 3px; background: var(--rule); position: relative; }
	.device .bar-track span::after { content: ''; position: absolute; inset: 0 40% 0 0; background: var(--foreground); }
	.record { position: absolute; z-index: 3; left: 1172px; top: 634px; width: 217px; height: 60px; background: var(--surface); border: 1px solid var(--rule); display: flex; align-items: center; gap: 14px; padding: 0 16px; font-size: 13px; }
	.record svg { color: var(--honour); flex: none; }
	.record b { display: block; font-weight: 400; font-size: 15px; margin-top: 2px; }

	/* Phone frame: plan §12.2 and §12.3 below 768. */
	body.phone { width: 390px; height: 844px; }
	.phone .bar { height: 56px; padding: 0 16px; gap: 8px; }
	.phone .bar .lockup .wordmark { font-size: 17px; }
	.phone .bar .lockup svg { width: 22px; height: 22px; }
	.phone .bar .filled { height: 44px; padding: 0 14px; margin-left: auto; }
	.phone .bar .menu { width: 44px; height: 44px; display: grid; place-items: center; }
	.phone .hero { padding: 152px 16px 48px; text-align: center; }
	.phone .text { position: relative; z-index: 2; display: flex; flex-direction: column; align-items: center; }
	.phone .text h1 { font-size: 31.2px; margin-top: 16px; }
	.phone .text .lead { margin-top: 20px; }
	.phone .text .actions { display: flex; gap: 12px; margin-top: 28px; width: 100%; justify-content: center; }
	.phone.stack .text .actions { flex-direction: column; }
	.phone.stack .text .actions > * { width: 100%; }
	.phone .text .small { margin-top: 20px; max-width: 34ch; }
	.phone .pause { right: 6px; bottom: 4px; }
	.phone .proof { grid-template-columns: 1fr 1fr; }
	.phone .cell { padding: 18px 8px; }
	.phone .cell:nth-child(odd) { border-right: 1px solid var(--rule-faint); }
	.phone .cell:nth-child(-n + 2) { border-bottom: 1px solid var(--rule-faint); }
	.phone .numeral { font-size: 40px; }
	.phone .cell .label { margin-top: 8px; font-size: 11px; }
	.phone .cell.word .numeral { font-family: Oswald, sans-serif; font-weight: 500; font-size: 26px; letter-spacing: 0.08em; line-height: 1.5; }
</style>
</head>
<body>
<div class="hero">
	<img class="poster" alt="" />
	<div class="scrim"></div>
	<div class="column"></div>
	<header class="bar">
		<a class="lockup">
			<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="7" r="4.5"/><path d="M3 18h18M8 14v8M16 14v8M4 16v4M20 16v4"/></svg>
			<span class="wordmark">Sunnsteel</span>
		</a>
		<nav data-desktop><span data-t="product"></span><span data-t="pricing"></span></nav>
		<div class="right" data-desktop>
			<span class="lang label" data-lang></span>
			<span class="action" data-t="signIn"></span>
			<span class="filled button" data-t="startFree"></span>
		</div>
		<span class="filled button" data-phone data-t="startFree"></span>
		<span class="menu" data-phone><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 7h18M3 12h18M3 17h18"/></svg></span>
	</header>
	<div class="text">
		<p class="label" data-t="eyebrow"></p>
		<h1 class="display" data-t="headline"></h1>
		<p class="lead" data-t="lead"></p>
		<div class="actions">
			<span class="filled button" data-t="create"></span>
			<span class="ghost action"><span data-t="signIn"></span></span>
		</div>
		<p class="small" data-t="install"></p>
	</div>
	<div class="device" data-desktop>
		<div class="status"><span>9:41</span><span>●●● ▮</span></div>
		<h3 data-t="squat"></h3>
		<p class="label" data-t="live"></p>
		<div class="row"><span>1&nbsp;&nbsp; 80 kg × 5</span><span>✓</span></div>
		<div class="row"><span>2&nbsp;&nbsp; 80 kg × 5</span><span>✓</span></div>
		<div class="row"><span>3&nbsp;&nbsp; 80 kg × 5</span><span>✓</span></div>
		<div class="rest"><p class="label" data-t="rest"></p><div class="bar-track"><span></span>1:24</div></div>
	</div>
	<div class="record" data-desktop>
		<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M12 20V5M5 11l7-7 7 7"/></svg>
		<div><span data-t="recordLine"></span><b data-t="recordValue"></b></div>
	</div>
	<span class="pause"><i><svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><rect x="5" y="4" width="5" height="16"/><rect x="14" y="4" width="5" height="16"/></svg></i></span>
</div>
<section class="proof">
	<div class="cell"><span class="numeral" data-t="n1"></span><span class="label" data-t="l1"></span></div>
	<div class="cell"><span class="numeral" data-t="n2"></span><span class="label" data-t="l2"></span></div>
	<div class="cell"><span class="numeral">80+</span><span class="label" data-t="l3"></span></div>
	<div class="cell word"><span class="numeral" data-t="n4"></span><span class="label" data-t="l4"></span></div>
</section>
<script>
	const q = new URLSearchParams(location.search)
	const frame = q.get('frame') ?? 'desktop'
	const lang = q.get('lang') ?? 'en'
	const T = {
		en: {
			product: 'Product ⌄', pricing: 'Pricing', signIn: 'Sign in', startFree: 'Start free',
			eyebrow: 'Free to start · No app store needed',
			headline: "Statues aren't born. They're <mark>carved</mark>.",
			lead: 'Plan your training, log every set and watch your records and your rank build up, in a history nobody can fake.',
			create: 'Create a free account',
			install: 'Works in your browser and installs on any phone, with no app store. <a>How to install</a>',
			squat: 'Squat', live: 'Live workout', rest: 'Rest', recordLine: 'New record · Squat', recordValue: '85 kg × 5',
			n1: '12,400', l1: 'Members', n2: '350,000', l2: 'Workouts logged', l3: 'Exercises in the catalog', n4: 'Free', l4: 'To start',
		},
		es: {
			product: 'Producto ⌄', pricing: 'Precios', signIn: 'Iniciar sesión', startFree: 'Empezar gratis',
			eyebrow: 'Gratis para empezar · Sin tienda de apps',
			headline: 'Las estatuas no nacen. <mark>Se esculpen</mark>.',
			lead: 'Planifica tu entrenamiento, registra cada serie y mira crecer tus récords y tu rango, en un historial que nadie puede inventar.',
			create: 'Crear cuenta gratis',
			install: 'Funciona en el navegador y se instala en cualquier teléfono, sin tienda. <a>Cómo instalarla</a>',
			squat: 'Sentadilla', live: 'Entrenamiento en vivo', rest: 'Descanso', recordLine: 'Nuevo récord · Sentadilla', recordValue: '85 kg × 5',
			n1: '12.400', l1: 'Miembros', n2: '350.000', l2: 'Entrenamientos registrados', l3: 'Ejercicios en el catálogo', n4: 'Gratis', l4: 'Para empezar',
		},
	}[lang]
	// Brand-line trials: ?h=<headline html> replaces the headline, ?font=condensed
	// sets it in Bebas Neue instead of Cinzel.
	if (q.get('h')) T.headline = q.get('h')
	document.documentElement.lang = lang
	document.body.className = frame + (q.get('stack') === '1' ? ' stack' : '') + (q.get('font') === 'condensed' ? ' condensed' : '')
	document.querySelectorAll('[data-t]').forEach(el => { el.innerHTML = T[el.dataset.t] })
	document.querySelector('[data-lang]').innerHTML = lang === 'en' ? '<b>EN</b> · ES' : 'EN · <b>ES</b>'
	document.querySelectorAll(frame === 'desktop' ? '[data-phone]' : '[data-desktop]').forEach(el => el.remove())
	document.querySelector('img.poster').src = `../../../public/site/video/${frame === 'desktop' ? 'hero-desktop' : 'hero-phone'}-poster.webp`
</script>
</body>
</html>
