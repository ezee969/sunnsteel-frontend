name: End-to-end

# PLAT-03: one browser path through both apps on every pull request -- sign
# in, build a routine from a template, train it to the recap -- against a
# stack this job builds: a local Supabase (Auth and its Postgres) for the
# identity, the app's database beside it, the backend from its repository's
# main and this commit's frontend. No real account and no secret is used.
# The visual sweep stays local.

on:
  pull_request:
    branches: ["**"]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Each repository in its own folder: `next build` typechecks every .ts
    # under the frontend, so the backend must not sit inside it.
    defaults:
      run:
        working-directory: frontend
    env:
      E2E_EMAIL: ci-member@sunnsteel.test
      APP_URL: http://localhost:3000
      API_URL: http://localhost:4000/api
    steps:
      - name: Checkout frontend
        uses: actions/checkout@v4
        with:
          path: frontend

      - name: Checkout backend
        uses: actions/checkout@v4
        with:
          repository: ezee969/sunnsteel-backend
          ref: main
          path: backend

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            backend/package-lock.json

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.121.0

      # In its own folder: this repository's supabase/migrations holds the
      # production storage bucket, which the stack must not try to apply.
      - name: Start a local Supabase
        working-directory: ${{ runner.temp }}
        run: |
          mkdir -p sb && cd sb
          supabase init < /dev/null
          supabase start -x studio,imgproxy,edge-runtime,logflare,vector,realtime,storage-api,postgres-meta
          # `status -o env` quotes its values; $GITHUB_ENV would keep the quotes.
          supabase status -o env | sed -E 's/^([A-Z_]+)="?([^"]*)"?$/SB_\1=\2/' >> "$GITHUB_ENV"

      - name: Create the app's database
        working-directory: ${{ runner.temp }}
        run: psql "$SB_DB_URL" -c 'CREATE DATABASE sunnsteel'

      - name: Install, migrate, seed and build the backend
        working-directory: backend
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/sunnsteel
        run: |
          npm ci
          npx prisma migrate deploy
          npm run db:seed
          npm run build

      - name: Start the backend
        working-directory: backend
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/sunnsteel
          SUPABASE_URL: ${{ env.SB_API_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ env.SB_SERVICE_ROLE_KEY }}
          FRONTEND_URL: ${{ env.APP_URL }}
          PORT: 4000
          NODE_ENV: production
          REALTIME_DISABLED: "true"
        run: |
          nohup npm run start:prod > "$RUNNER_TEMP/backend.log" 2>&1 &
          for i in $(seq 1 60); do
            curl -sf http://localhost:4000/api/health > /dev/null && exit 0
            sleep 2
          done
          cat "$RUNNER_TEMP/backend.log"
          exit 1

      - name: Install and build the frontend
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ env.SB_API_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ env.SB_ANON_KEY }}
          NEXT_PUBLIC_API_URL: ${{ env.API_URL }}
          NEXT_PUBLIC_SITE_URL: ${{ env.APP_URL }}
          NEXT_PUBLIC_FRONTEND_URL: ${{ env.APP_URL }}
        run: |
          npm run lock:check
          npm ci
          npm run build

      - name: Start the frontend
        run: |
          nohup npx next start -p 3000 > "$RUNNER_TEMP/frontend.log" 2>&1 &
          for i in $(seq 1 60); do
            curl -sf http://localhost:3000/login > /dev/null && exit 0
            sleep 2
          done
          cat "$RUNNER_TEMP/frontend.log"
          exit 1

      - name: Create the run's member
        run: node e2e/ci/create-member.mjs

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run the end-to-end path
        run: npx playwright test -c playwright.ci.config.ts

      - name: Server logs
        if: failure()
        run: |
          echo "--- backend ---"; tail -n 200 "$RUNNER_TEMP/backend.log" || true
          echo "--- frontend ---"; tail -n 100 "$RUNNER_TEMP/frontend.log" || true

      - name: Upload the report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 7
